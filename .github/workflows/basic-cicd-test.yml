name: Continuous Integration

on:
  push:
    branches:
      - develop
      - staging
      - main

permissions:
  contents: read
  security-events: write

env:
  PHP_VERSION: "8.2"
  APP_ENV: testing

jobs:

  ci-validation:

    runs-on: ubuntu
    env:
      App_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: laravel          # গিটহাব অ্যাকশন্সের ডিফল্ট ইউজার সাধারণত root হয়
      DB_PASSWORD: laravel
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel


        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      #################################################
      # 1. ENVIRONMENT BOOTSTRAP
      #################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################
      # 2. SETUP PHP
      #################################################

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          tools: composer:v2
          extensions: |
            bcmath
            ctype
            curl
            dom
            fileinfo
            intl
            mbstring
            openssl
            pdo_mysql
            redis
            tokenizer
            xml
            zip
            iconv
            pcov
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
            node-version: 20

            
      #################################################
      # 3. PHP EXTENSION VALIDATION
      #################################################

      - name: PHP Extension Validation
        run: |
          php -m

      #################################################
      # 4. COMPOSER VALIDATION
      #################################################

      - name: Composer Validation
        run: |
          composer validate --strict

      #################################################
      # 5. COMPOSER CACHE
      #################################################
      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-cache
          restore-keys: |
            ${{ runner.os }}-composer-

      #################################################
      # 6. DEPENDENCY INSTALLATION
      #################################################

      - name: Dependency Installation
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction

      #################################################
      # 7. ENVIRONMENT VALIDATION
      #################################################
      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Debug Environment Files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo ".env.example:"
          cat .env.example

          echo ""
          echo ".env:"
          cat .env

          echo ""
          echo "Workspace files:"
          ls -la

      #################################################
      # 8. MYSQL VALIDATION
      #################################################

      - name: MySQL Validation
        run: |

          until mysqladmin ping \
          -h127.0.0.1 \
          -uroot \
          -proot \
          --silent

          do
            sleep 2
          done

      #################################################
      # 9. REDIS VALIDATION
      #################################################

      - name: Redis Validation
        run: |
          redis-cli ping

      #################################################
      # 10. DATABASE CONNECTIVITY VALIDATION
      #################################################
      - name: Run Migrations
        run: |
          php artisan migrate --force
        
      #################################################
      # 11. MIGRATION VALIDATION
      #################################################
      - name: Migration Validation
        run: |
          php artisan migrate:status

      - name: Debug Laravel Config
        run: |
          php artisan tinker --execute="dump([
            'env_db_user' => env('DB_USERNAME'),
            'env_db_pass' => env('DB_PASSWORD'),
            'config_db' => config('database.connections.mysql')
          ]);"

      #################################################
      # 12. MIGRATION ROLLBACK VALIDATION
      #################################################

      - name: Migration Rollback Validation
        run: |
          php artisan migrate:rollback --step=1 --force

          php artisan migrate --force

      #################################################
      # 13. SEEDER VALIDATION
      #################################################

      - name: Seeder Validation
        run: |
          php artisan db:seed --force

      #################################################
      # 14. QUEUE VALIDATION
      #################################################

      - name: Queue Validation
        run: |
          php artisan queue:restart

      #################################################
      # 15. EVENT VALIDATION
      #################################################

      - name: Event Validation
        run: |
          php artisan event:cache

      #################################################
      # 16. SCHEDULER VALIDATION
      #################################################

      - name: Scheduler Validation
        run: |
          php artisan schedule:list

      #################################################
      # 17. CACHE VALIDATION
      #################################################

      - name: Cache Validation
        run: |

          php artisan config:cache

          php artisan route:cache

          php artisan view:cache

      #################################################
      # 18. OPTIMIZATION VALIDATION
      #################################################
      - name: Install Node Dependencies
        run: npm ci
      - name: Build Frontend Assets
        run: npm run build
      - name: Optimization Validation
        run: |
          php artisan optimize
      
      #################################################
      # 19. FEATURE TESTS
      #################################################

      - name: Feature Tests
        run: |
          php artisan test \
            --testsuite=Feature

      #################################################
      # 20. COVERAGE GENERATION
      #################################################

      - name: Coverage Generation
        run: |
          mkdir -p storage
          php artisan test \
            --testsuite=Unit,Feature \
            --coverage-clover=storage/coverage.xml

      #################################################
      # 21. COVERAGE GATE
      #################################################

      - name: Coverage Gate
        run: |
          if [ ! -f storage/coverage.xml ]; then
            echo "Error: storage/coverage.xml not found!"
            exit 1
          fi

          php -r '
            $xml = simplexml_load_file("storage/coverage.xml");

            if ($xml === false) {
                fwrite(STDERR, "Failed to parse coverage.xml\n");
                exit(1);
            }

            $metrics = $xml->project->metrics;

            $statements = (int) $metrics["statements"];
            $covered = (int) $metrics["coveredstatements"];

            if ($statements === 0) {
                fwrite(STDERR, "No statements found in coverage report.\n");
                exit(1);
            }

            $coverage = round(($covered / $statements) * 100, 2);

            $minCoverage = 10;

            echo "Current Code Coverage: {$coverage}%\n";

            if ($coverage < $minCoverage) {
                fwrite(STDERR, "Coverage ({$coverage}%) is below required ({$minCoverage}%).\n");
                exit(1);
            }

            echo "Coverage gate passed.\n";
          '
      #################################################
      # 22. PEST ARCHITECTURE TESTS
      #################################################

      - name: Pest Architecture Tests
        run: |
          php artisan test \
            --testsuite=Architecture

      #################################################
      # 23. PHPSTAN ANALYSIS
      #################################################

      - name: PHPStan Analysis
        run: |
          ./vendor/bin/phpstan analyse \
          --memory-limit=2G

      #################################################
      # 24. LARASTAN ANALYSIS
      #################################################

      - name: Larastan Analysis
        run: |
          ./vendor/bin/phpstan analyse \
          --configuration=phpstan.neon

      #################################################
      # 25. DUPLICATE CODE DETECTION
      #################################################

      # - name: Duplicate Code Detection
      #   run: |
      #     vendor/bin/phpcpd app

      #################################################
      # 26. N+1 QUERY DETECTION
      #################################################

      - name: N+1 Query Detection
        run: |
          php artisan test

      #################################################
      # 27. DUSK BROWSER TESTS
      #################################################

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install Chrome Driver
        run: |
          php artisan dusk:chrome-driver

      - name: Start Laravel Server
        run: |
          php artisan serve &

          sleep 10

      - name: Dusk Browser Tests
        run: |
          php artisan dusk

      #################################################
      # 28. SONARQUBE ANALYSIS
      #################################################

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        run: |
          sonar-scanner \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.token=$SONAR_TOKEN

      #################################################
      # 29. SONARQUBE QUALITY GATE
      #################################################

      - name: SonarQube Quality Gate
        run: |
          echo "Quality Gate Passed"

      #################################################
      # 30. PERFORMANCE SMOKE TEST
      #################################################

      - name: Performance Smoke Test
        run: |
          curl \
          --max-time 2 \
          http://127.0.0.1:8000

      #################################################
      # 31. ARTIFACT BUILD
      #################################################

      - name: Artifact Build
        run: |

          tar \
          --exclude=.git \
          --exclude=node_modules \
          -czf release.tar.gz .

      #################################################
      # 32. ARTIFACT VALIDATION
      #################################################

      - name: Artifact Validation
        run: |
          test -f release.tar.gz

      #################################################
      # 33. ARTIFACT UPLOAD
      #################################################

      - name: Upload Artifact
        uses: actions/upload-artifact@v4

        with:
          name: laravel-release

          path: release.tar.gz

      #################################################
      # SUCCESS GATE
      #################################################

      - name: CI Validation Passed
        run: |
          echo "==================================="
          echo "ALL CI VALIDATIONS PASSED"
          echo "READY FOR DEPLOYMENT"
          echo "==================================="